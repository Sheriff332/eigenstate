# ==============================================================================
# 1. DEFINE YOUR REAL APP OPENERS
# ==============================================================================
[opener]
# Universal hook to automatically mirror your true mimeapps.list fallback choices
system_default = [
    { run = 'gio open "%s"', desc = "Open with system default" }
]

# Graphical Applications (using the exact Arch binary names)
zed = [
    { run = 'zeditor "%s"', orphan = true, for = "unix" }
]
vivaldi-stable = [
    { run = 'xdg-open %s', orphan = true, for = "unix" }
]
oculante = [
    { run = 'oculante "%s"', orphan = true, for = "unix" }
]
mpv = [
    { run = 'mpv "%s"', orphan = true, for = "unix" }
]

# LibreOffice
libreoffice-writer = [
    { run = "libreoffice --writer %s", orphan = true, block = false, for = "unix" }
]

libreoffice-calc = [
    { run = "libreoffice --calc %s", orphan = true, block = false, for = "unix" }
]

libreoffice-impress = [
    { run = "libreoffice --impress %s", orphan = true, block = false, for = "unix" }
]

libreoffice-draw = [
    { run = "libreoffice --draw %s", orphan = true, block = false, for = "unix" }
]

# Terminal Fallback
micro = [
    { run = 'micro "%s"', block = true, for = "unix" }
]

extract = [
	{ run = 'ouch decompress --yes %s', desc = "Extract here" }
]

# ==============================================================================
# 2. BIND FILE PATTERNS PERFECTLY TO YOUR WORKFLOW
# ==============================================================================
[open]
prepend_rules = [
    # Text, Configs, and Programming Scripts (Drop straight into Zed)
    { mime = "text/*", use = "zed" },
    { url = "*.{json,toml,yaml,conf,lua,sh,md,css,rs,py,c,go,cpp,jsonc,typ}", use = "zed" },

    # Web Files (Vivaldi Browser)
    { mime = "text/html", use = "vivaldi-stable" },
    { mime = "application/pdf", use = "vivaldi-stable" },

    # Images (Oculante)
    { mime = "image/*", use = "oculante" },

    # Videos (MPV)
    { mime = "video/*", use = "mpv" },
    { mime = "audio/*", use = "mpv" },

    { url = "*.{odt,ott,doc,docx,docm,rtf}", use = "libreoffice-writer" },
    { url = "*.{ods,ots,xls,xlsx,xlsm,xlt,xltx,csv,tsv}", use = "libreoffice-calc" },
    { url = "*.{odp,otp,ppt,pptx,pptm,pps,ppsx,pot,potx}", use = "libreoffice-impress" },
    { url = "*.{odg,otg,svg,eps,emf,wmf,pdf}", use = "libreoffice-draw" },


    # Extract Files (Ouch)
    { mime = "application/zip", use = [ "extract", "reveal" ] },
    { mime = "application/rar", use = [ "extract", "reveal" ] },
    { mime = "application/x-tar", use = [ "extract", "reveal" ] },
    { mime = "application/x-bzip2", use = [ "extract", "reveal" ] },
    { mime = "application/x-7z-compressed", use = [ "extract", "reveal" ] },
    { mime = "application/x-rar", use = [ "extract", "reveal" ] },
    { mime = "application/x-xz", use = [ "extract", "reveal" ] },

    # Catch-all: Everything else defaults strictly to your xdg system preferences
    { url = "*", use = "system_default" }
]

[[plugin.prepend_previewers]]
mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}"
run  = "ouch"
