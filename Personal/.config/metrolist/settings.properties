clean code.\\r\\n\u200EAdded advanced login by token, tnx @mikooomich\\r\\nAdded animations to AutoPlaylists\\r\\nAdded Greek language, tnx @Dimitrysaf \\r\\nBugs fixes and many more.","published_at"\:"2025-01-23T21\:05\:37Z","assets"\:[{"name"\:"Metrolist.apk","state"\:"uploaded","size"\:4958681,"browser_download_url"\:"https\://github.com/MetrolistGroup/Metrolist/releases/download/v10.10.0/Metrolist.apk"}],"target_commitish"\:"main"},{"tag_name"\:"nightly","draft"\:false,"prerelease"\:true,"body"\:"Version 14.0.1+c7b6590, built from [c7b6590d3b45d5acd1875608794fb8aef37b8d49](https\://github.com/MetrolistGroup/Metrolist/commit/c7b6590d3b45d5acd1875608794fb8aef37b8d49). This prerelease may be unstable.\\n\\n\#\# Changes since previous nightly\\n\\nInternal changes only.\\n\\n\#\# Changes since v14.0.0\\n\\n\#\#\# New\\n\\n* Lyrics\: glyphmind romanization with local language detection, option to hide the original script, word-by-word animation while casting (44f32e5f3, 88af29e6c, 80d385cf7)\\n* Player\: 1440p music video quality, cast and audio/video switch moved into the player menu, collections start in shuffle mode (5993ca4f6, 96715c768, 3a98d1119)\\n* UI\: unavailable songs are greyed out with an explanation on tap, 150%, 175% and 200% display density presets (e40478e67, 0aa6776b2)\\n* Desktop\: Matugen wallpaper colors, current song in the window title, tray minimize and toggle settings, nightly builds offered after a crash (515bc6c79, c92a3c694, 7d98d60dd, 8a26e84b6)\\n* Downloads\: split auto-download settings for albums and playlists from liked songs (ca37ca940)\\n* Library\: sort songs by download date and listening time, add songs to the library from the song menu (1e6d39850, 899f36655, b3ae78df2)\\n* Podcast\: search episodes on the podcast page (7eafcd289)\\n* Search\: results scroll into view when a search bar opens (af1644ba0)\\n* Cast\: Sonos groups listed at their coordinator (09af67764)\\n* Crash log\: prompt to share logs after a crash (cd1bf3a5b, 0b6b24456)\\n* Settings\: hints on how to undo hides and blocks (b3a81625a)\\n\\n\#\#\# Improved\\n\\n* Desktop\: much lower software-rendering and playback CPU cost, marquees step in whole pixels, monitor probes paused when hidden (f08ff4672, 31820b5fa, b07123139, ff52090fb, 42a9bb744, 303940cf5, 98054e013, 4ea84a094)\\n* History\: consolidated entry menus, remote and local plays grouped under the same dates, local time zone labels (54a83bd28, 02c446a29, 3930e10e6)\\n* Statistics\: pull-to-refresh limited to the top of the list (4bebcda99)\\n* Settings\: storage summary matches the system style (10b81e204, 0a5a47034)\\n\\n\#\#\# Fixed\\n\\n* Import\: Tidal collection and track metadata, all Deezer and Apple Music album pages, artist credits and featured-artist matching, signed-out batches, per-playlist import on Android, timeout and failure reporting, duplicate imports resumable, desktop local playlists, empty JSON lists and null fields handled (8e13780c1, c8719ff47, 959a3374e, 6c617a0bb, 8a20242c7, f24bdfbbe, 1b5ffbcc6, fc39199a2, 7172398f2, 3d93423cd, 0296061f0, 089d084c0, 9a7f836a3, d7b6cf534, cf951189a, d171b7277, 379f01895, cfc4c3ed7, ed73cc0bb, f73a50424, 94eb4dcff, bb40cb3d0)\\n* Playback\: shuffle the whole playlist after starting from a song, gapless transitions restored, equalizer kept across tracks, Repeat All Previous wrap, v13 audio cache recovered, downloads preserved across video mode changes, HLS audio-only fallback, stale video preloads rejected, live stream and audio counterpart fixes, audio focus and task removal handling (b450efd00, 6fc5be59a, 8118d6bdf, cd440ebae, 2e559b717, 26053b132, 990cab7ca, 69f7772b6, 88f0b4f46, cf8cdf93b, 282c5ae77, 4eb850cf6, bb2f61dce, 54760359d, ef0c6f7f8, 428e12778, 29e3a8c7f, eec58f1f9, f54887bfc, 5b3e8e34d, 0f79b3fe7, ad8ba92dd, 51189a3e3, 72b73fa33, 593581b10, a8c8e4111, bd6441d55)\\n* Lyrics\: failed Google romanization reported, legacy timing and singer tags, bundled TTML translations, translation target and mode respected, scroll bouncing, word highlight timing, legacy lyrics protected, Lyprio attribution and lookups, translation caches (475948408, 8be727975, eba449f9a, 50819e359, 2154a9c27, 04239990f, 6797c6be7, 09127d03e, 384518a69, 4db9e3a7f, a63ed53de, bf55d6c20, e569778a2, 7a8669cfb)\\n* Desktop\: Windows native builds, WebView2 recovery, system proxy, restart command, macOS tray hang, dark mode title bar, macOS 15 requirement, Linux audio routes, window identity and drag crash, crossfade overlap, miniplayer theme and dragging, native-image registrations (54715a553, 99266f972, 01f6997bb, 9fda985c9, 0103ba840, 835a22070, 79ccaeedf, 0464a39a4, 364c99178, d3277a45f, 873bc0345, 7585f26e4, 7b0a07bb3, aa279bb66, f091c3ba1, 2cef215d7, 17108dc81, 5ce132549, 292156197, 5015f4d58, 9dcbe1bb6, 5fc4ba35f, ba7c245f5, 2f6890bca, 621e280c6, 440798a86, 6782fe58c, 6d9d71b3a, f70de737a)\\n* Library\: v14 upgrade recovery for likes, albums and saved songs, badges from local membership, sorting and view state, uploads and artist artwork, sync retries (95a7c116a, 61dbf9297, b08d4995e, 61a48dd04, 212c83b7d, c10335b0a, a4c4768f8, a21e6ca5f, 178fb6164, cbc553915, 02cd3ee16, 75c7e8352, 2af3d8c14, 02f3daf4a)\\n* Downloads\: queue resume after service restart, artwork in Android exports, incomplete responses and deletion failures, legacy dates, tracks shared by offline playlists (1b9c81e87, 4b5861d6a, f606b3ecf, b2c1f2e18, 7a760cbf4, a35ea0a1e, 1ed104bc3)\\n* Search\: stale responses after clearing history, repeated link searches, popup dismissal, floating search focus, top-result Play button, viewport preservation (ee4d28fe3, 20d84b76a, 718b90484, 15c530d64, 03e441b4a, a1a71a387, 0c2493678, 0f60200e5, 3a07479a2)\\n* Cast\: DLNA XML parsing on Android, fixed stream port, connections kept across songs, superseded load errors, seek reset, devices sheet layout (76b6b3365, c2ca2451d, 667b8bc73, d724c6bc5, 7805ebd0b, 5ba44f987, 157d05611)\\n* Scrobble\: notification when Last.fm sign-in expires, plays held until re-sign-in, cleared retries, Integrations dialog sign-in (0cfa318ac, ddf10447d, b7ffc8250, 0a585e64c)\\n* Canvas\: Spotify account no longer used for lookups, public fallback when signed in, desktop serialization (6853e761a, 97d5576b3, 31911e588)\\n* Player and UI\: artwork layout in short windows, control and share colors, centered landscape controls, compact three-column widget, mini-player styles on tablets, navigation transitions and corner clipping, dismissed sheets, menu wrapping and corners (14e479816, 71050a6e7, d5736b585, 921688287, 0fe0b755f, dcae79b29, b05b3a3c9, 3d9d343e7, cef71b472, 35e777078, cb673d974, ff774ed63, 8eb3e9937, 086865366, 795da3f91, 9449a2b02)\\n* Android\: legacy playlist covers, custom cover orientation, radio from Speed Dial, offline queue resume, media session capabilities and transport actions, account menu on tablets, hardware bitmap blur, status bar contrast, Quick Settings tile in secondary profiles (c4c895453, 38e1327cd, f39d2cc49, 4e484a3bf, 916e67088, 3a21b4947, 2cc71ae3c, 24897bcdc, 0acb688f8, 42caa5f8c)\\n* Settings and accounts\: secrets kept in memory when Keystore fails, open-by-default fallback, legacy preference and locale migrations, home section toggles, AI-artist blocklist size, Spotify and Discord sign-in persistence, likes merged on sign-in (aa2eda862, b31a2e418, a874700d7, 2da475ae9, 560f67be5, 92c1346b7, cfe16b78e, d77a22510, 273ae3244, 937bfb539, 75c7e8352)\\n* Listen Together\: connection failure logging, translated server locations, pending approvals, settings switches (bb4e1a64a, cf92cf049, b0a9bab91, eb0c51691)\\n* Playlists and queues\: negative and repeated positions, M3U metadata, autoplay after shuffled collections, legacy speed dial table merge (ea7027378, a903153a1, 1404ba751, 9ee86819f, 2cae6ac54)\\n* Login and links\: Google sign-in interstitials, regional account hosts, Spotify Linux sign-in, encoded open links and wrapped video timestamps (a9c951abe, 2d4f7c15e\u21922d4fcd15e, 84dcd4e78, a26fcfa94)\\n* Android Auto\: full queue kept when resuming offline (4e484a3bf)\\n* Backup\: concurrent exports isolated, legacy database relationships removed, keyring recovery explained (6e5b8faf1, cbe1ce176)\\n* Updates\: prereleases kept out of stable prompts, nightly builds clearly labeled (66c7e1b54, 339d96b9b\u2192339d96b8)\\n* Equalizer\: MetroEQ presets separated from saved profiles (6f228e3f5)\\n\\nSummarised from commit messages by z-ai/glm-5.3-flash.\\n","published_at"\:"2026-11-19T00\:49\:42Z","assets"\:[{"name"\:"Metrolist-Desktop-linux-x64.AppImage","state"\:"uploaded","size"\:139094520,"digest"\:"sha256\:78a61e59e5ea960201781a5fc113fd4a3dcd1ff9d407eb1569a9406eb167acb7","browser_download_url"\:"https\://github.com/MetrolistGroup/Metrolist/releases/download/nightly/Metrolist-Desktop-linux-x64.AppImage"},{"name"\:"Metrolist-Desktop-windows.zip","state"\:"uploaded","size"\:221878075,"digest"\:"sha256\:621c488fb09855ab1037b40315d97c7e6c4d01d3b128d70b90c9701b2c124c05","browser_download_url"\:"https\://github.com/MetrolistGroup/Metrolist/releases/download/nightly/Metrolist-Desktop-windows.zip"},{"name"\:"Metrolist.apk","state"\:"uploaded","size"\:15088389,"digest"\:"sha256\:a99e3665b80c61462f4b02e33d673f1b78638be6f2cff15739cdc71d01828864","browser_download_url"\:"https\://github.com/MetrolistGroup/Metrolist/releases/download/nightly/Metrolist.apk"}],"target_commitish"\:"c7b6590d3b45d5acd1875608794fb8aef37b8d49"}]
