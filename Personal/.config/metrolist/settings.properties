feedback has been very positive. To try it, join our Discord and donate at least $1 to support development.\\n\\n\#\# Highlights\\n- Migrated networking to InnerTubeX with automatic client fallback (@nyxiereal)\\n- Reduced memory use and background work in large libraries, History, Cache, Android Auto, and audio processing (@makro17 @nyxiereal)\\n- Repaired older-version upgrades, Android Auto browsing, artist metadata, and YouTube channel switching (@nyxiereal)\\n- Improved login, account loading, uploads, downloads, caching, metadata editing, and playlist sync (@nyxiereal)\\n- Restored the classic app icon (@nyxiereal)\\n\\n\#\# New features\\n- Choose whether songs are added to the start or end of playlists (@nyxiereal)\\n- Added Zemer lyrics for Jewish music (@alltechdev)\\n- Added detailed, copyable playback error reports (@nyxiereal)\\n- Added a unified update prompt for standalone and KMP releases (@nyxiereal)\\n- Added Inception AI models and improved lyric translation output (@nyxiereal)\\n- Restored universal x86 and x86_64 support (@nyxiereal)\\n\\n\#\# Fixes and improvements\\n- Fixed missing or cropped artwork and improved timed and Cyrillic lyrics (@RizkLee @GameOn223 @Cocoa2219 @nyxiereal)\\n- Preserved manual metadata edits during refreshes and corrected Cache Playlist contents (@nyxiereal)\\n- Fixed repeat and shuffle with crossfade, Listen Together stutter, and paused queues restarting at the end (@nyxiereal)\\n- Fixed per-song volume normalization and improved playback recovery (@nyxiereal)\\n- Fixed dismissed media controls reappearing and several startup crashes (@nyxiereal)\\n- Protected local likes from incomplete sync responses and improved uploaded-song handling (@nyxiereal)\\n- Updated dependencies and CI (@nyxiereal)\\n\\nNew contributors\: @RizkLee (\#4277), @GameOn223 (\#4269), and @makro17 (\#4270)\\n\\n**Full changelog**\: https\://github.com/MetrolistGroup/Metrolist/compare/v13.6.3...v13.7.0\\n\\n","published_at"\:"2026-09-07T19\:22\:03Z","assets"\:[{"name"\:"Metrolist-izzy.apk","state"\:"uploaded","size"\:26868210,"digest"\:"sha256\:6d2a5b6a2c7df2b09c6c31969a3978a61898879556f226bb3095596f07c874d7","browser_download_url"\:"https\://github.com/MetrolistGroup/Metrolist/releases/download/v13.7.0/Metrolist-izzy.apk"},{"name"\:"Metrolist-with-Google-Cast.apk","state"\:"uploaded","size"\:28479899,"digest"\:"sha256\:fa53a5dc39151924f128a67df16ca18e6202c6e9a4041dc1a27aa6e26d588646","browser_download_url"\:"https\://github.com/MetrolistGroup/Metrolist/releases/download/v13.7.0/Metrolist-with-Google-Cast.apk"},{"name"\:"Metrolist.apk","state"\:"uploaded","size"\:26872306,"digest"\:"sha256\:6d52643d29cf78fd5f10464c7a64012439f29767e48830064b06df40fe97d527","browser_download_url"\:"https\://github.com/MetrolistGroup/Metrolist/releases/download/v13.7.0/Metrolist.apk"}],"target_commitish"\:"main"},{"tag_name"\:"v13.6.3","draft"\:false,"prerelease"\:false,"body"\:"This is a hotfix release to fix borked lyrics and media controller. We apologize for the inconvenience.  \\r\\n\\r\\n~ MetrolistGroup\\r\\n\\r\\n","published_at"\:"2026-08-07T22\:42\:21Z","assets"\:[{"name"\:"Metrolist-izzy.apk","state"\:"uploaded","size"\:24142299,"digest"\:"sha256\:288204c7e347f9333d909b37b111436e79bea833aa0988d7d0dae3ace1352c37","browser_download_url"\:"https\://github.com/MetrolistGroup/Metrolist/releases/download/v13.6.3/Metrolist-izzy.apk"},{"name"\:"Metrolist-with-Google-Cast.apk","state"\:"uploaded","size"\:25774469,"digest"\:"sha256\:ba4b7230bc2bf2dabeb6c9f9dc5454ab5f9df759ec044ae6e631d006153a1224","browser_download_url"\:"https\://github.com/MetrolistGroup/Metrolist/releases/download/v13.6.3/Metrolist-with-Google-Cast.apk"},{"name"\:"Metrolist.apk","state"\:"uploaded","size"\:24146395,"digest"\:"sha256\:774bb4ff1ddc5f0736798966addd2158de99d0304acb22e8285ab9b0abeb4d69","browser_download_url"\:"https\://github.com/MetrolistGroup/Metrolist/releases/download/v13.6.3/Metrolist.apk"}],"target_commitish"\:"main"},{"tag_name"\:"v13.6.2","draft"\:false,"prerelease"\:false,"body"\:"\# THE FUTURE OF METROLIST\\r\\nMetrolist KMP is almost ready. We are ironing out the remaining bugs and preparing for release, but it is still at least a couple of weeks away.\\r\\n\\r\\n\# Major changes\\r\\n- Fixed playback issues caused by changes that also broke official apps (@nyxiereal)\\r\\n- Fixed playlist sync duplication and out-of-memory crashes (@kairosci)\\r\\n- Improved automatic player configuration updates for future YouTube changes (@mostafaalagamy @nyxiereal)\\r\\n\\r\\n\#\# Notable new features\\r\\n- Added handling for KMP updates and migrations (@nyxiereal)\\r\\n\\r\\n\#\# Other improvements\\r\\n- Improved Android Auto voice search matching and radio queue generation (@FireLion137)\\r\\n- Added an Android Auto search limit and optimized local searches to prevent out-of-memory crashes (@FireLion137)\\r\\n- Fixed podcast playback errors (@kairosci)\\r\\n- Fixed crossfade timing at non-default playback speeds (@kairosci)\\r\\n- Fixed the app lingering in the background after it was closed (@kairosci)\\r\\n- Fixed sleep timer dialog layouts and menus containing long translated text (@kairosci)\\r\\n- Fixed the persistent shuffle setting not working (@SimoneFelici)\\r\\n- Dimmed the repeat button when repeat is disabled (@arpitagarwal1301)\\r\\n- Rounded the corners of exported lyrics images (@arpitagarwal1301)\\r\\n- Updated dependencies (@nyxiereal)\\r\\n\\r\\n\#\# New Contributors\\r\\n* @SimoneFelici made their first contribution in https\://github.com/MetrolistGroup/Metrolist/pull/4102\\r\\n* @arpitagarwal1301 made their first contribution in https\://github.com/MetrolistGroup/Metrolist/pull/4178\\r\\n\\r\\n**Full Changelog**\: https\://github.com/MetrolistGroup/Metrolist/compare/v13.6.1...v13.6.2\\r\\n\\r\\n","published_at"\:"2026-08-07T20\:24\:36Z","assets"\:[{"name"\:"Metrolist-izzy.apk","state"\:"uploaded","size"\:24175067,"digest"\:"sha256\:fd1457e84429fbd10f23fc9c33c352f93ccbf3d1c7124b42b0e237ad8df6f04a","browser_download_url"\:"https\://github.com/MetrolistGroup/Metrolist/releases/download/v13.6.2/Metrolist-izzy.apk"},{"name"\:"Metrolist-with-Google-Cast.apk","state"\:"uploaded","size"\:25807237,"digest"\:"sha256\:61b60f2886ebd605fc27fb0be200e32ea2e9d4ef94028001acec2bad5aa8807a","browser_download_url"\:"https\://github.com/MetrolistGroup/Metrolist/releases/download/v13.6.2/Metrolist-with-Google-Cast.apk"},{"name"\:"Metrolist.apk","state"\:"uploaded","size"\:24179163,"digest"\:"sha256\:7c24fbac355f9a3d64a13f3e89ebcd82142e3ee94e190440fc07f154cd9633cc","browser_download_url"\:"https\://github.com/MetrolistGroup/Metrolist/releases/download/v13.6.2/Metrolist.apk"}],"target_commitish"\:"main"},{"tag_name"\:"v13.6.1","draft"\:false,"prerelease"\:false,"body"\:"\# THE FUTURE OF METROLIST\\nThe new Kotlin Multiplatform version of Metrolist is now in a good state, and we are aiming to release it within the next month. Until then, the current app will remain in maintenance mode and receive bug fixes and minor improvements.\\n\\n\# Major changes\\n- Improved playback reliability and recovery from YouTube player failures (@alltechdev @JASK625 @kairosci @mostafaalagamy @nyxiereal)\\n- Fixed black screens, startup crashes, and playback freezes (@kairosci @mostafaalagamy @nyxiereal)\\n- Improved Listen Together synchronization (@nyxiereal)\\n\\n\#\# Notable new features\\n- Added refreshed branding and an optional dynamic app icon (@mostafaalagamy)\\n- Added predictive back support and improved landscape scaling (@HansHolz09 @kairosci)\\n\\n\#\# Other improvements\\n- Fixed login, logout, and backup restoration issues (@mostafaalagamy @kairosci @nyxiereal)\\n- Fixed incorrect artist names, song durations, podcast metadata, and missing artwork (@alltechdev @kairosci @mostafaalagamy @nyxiereal)\\n- Fixed Android Auto freezes and playback delays (@kairosci)\\n- Fixed foreground service ANRs and multiple other crashes (@kairosci @mostafaalagamy)\\n- Fixed sleep timer crashes and restored saved defaults (@johannesbrauer @mostafaalagamy)\\n- Improved library sync performance and YouTube player compatibility (@mostafaalagamy @nyxiereal)\\n\\n\#\# New Contributors\\n* @HansHolz09 made their first contribution in https\://github.com/MetrolistGroup/Metrolist/pull/3837\\n\\n**Full Changelog**\: https\://github.com/MetrolistGroup/Metrolist/compare/v13.6.0...v13.6.1\\n\\n","published_at"\:"2026-07-17T12\:17\:44Z","assets"\:[{"name"\:"Metrolist-izzy.apk","state"\:"uploaded","size"\:24109601,"digest"\:"sha256\:82ec9412f8092cf8f6da6bfc4706cb85b3aaa13f33920125411f05741dd16828","browser_download_url"\:"https\://github.com/MetrolistGroup/Metrolist/releases/download/v13.6.1/Metrolist-izzy.apk"},{"name"\:"Metrolist-with-Google-Cast.apk","state"\:"uploaded","size"\:25741771,"digest"\:"sha256\:ca13b64c97c6424784bc5646b13daec5e7b9cdcb2910e9fdcf84407032803ac3","browser_download_url"\:"https\://github.com/MetrolistGroup/Metrolist/releases/download/v13.6.1/Metrolist-with-Google-Cast.apk"},{"name"\:"Metrolist.apk","state"\:"uploaded","size"\:24113697,"digest"\:"sha256\:fe333f73893b64ef3a2ca7f21866ac24df91a16c7f5732f133cc44408977b417","browser_download_url"\:"https\://github.com/MetrolistGroup/Metrolist/releases/download/v13.6.1/Metrolist.apk"}],"target_commitish"\:"main"},{"tag_name"\:"v13.6.0","draft"\:false,"prerelease"\:false,"body"\:"\# MAINTENANCE MODE\\r\\nMetrolist is currently in maintenance mode. This means we will only be fixing bugs and making minor improvements. Please do not submit PRs for new features or major changes, as they will not be accepted.\\r\\n\\r\\n\\r\\n\#\# Version 13.6.0\\r\\n\\r\\n\#\#\# New Features\\r\\n- Added a self-healing, remote-updatable config system synced with [zemer-cipher](https\://github.com/ZemerTeam/zemer-cipher) from [zemer-app](https\://github.com/ZemerTeam/zemer-app) for more reliable streaming \u2014 @alltechdev & @mostafaalagamy\\r\\n\\r\\n\#\#\# Improvements & Performance\\r\\n- Faster artist screen loading, with a shimmer while it loads \u2014 @adrielGGmotion\\r\\n- Faster playback start and app relaunch \u2014 @alltechdev\\r\\n- Reduced startup blocking by batch-reading settings \u2014 @adrielGGmotion\\r\\n- Cleaner cache size display \u2014 @kairosci \u00B7 Correct FAB position in search \u2014 @il-Luca\\r\\n\\r\\n\#\#\# Bug Fixes\\r\\n- Fixed several crashes\: duplicate Home Screen items (@kairosci, @isotjs), audio recognition resampler (@adrielGGmotion), playback freeze loops on network errors (@kairosci)\\r\\n- Fixed artist name parsing and duration extraction \u2014 @kairosci\\r\\n- Fixed playback cache marking \u2014 @mostafaalagamy \u00B7 download stalls \u2014 @kairosci \u00B7 backup/restore compatibility \u2014 @kairosci\\r\\n- Fixed search query encoding \u2014 @Scott-Nx \u00B7 empty playlist/pagination bug \u2014 @kairosci\\r\\n- Restored artist links on the album screen \u2014 @adrielGGmotion\\r\\n- Streaming/cipher reliability fixes (config updates, self-heal, WebView rebuild) \u2014 @alltechdev; Apple Music token regex \u2014 @adrielGGmotion; Zemer config sync \u2014 @mostafaalagamy\\r\\n- Refactored Discord Rich Presence (pure Kotlin) \u2014 @adrielGGmotion & @CommandCodeBot\\r\\n\\r\\n\#\# New Contributors\\r\\n* @brb-fr made their first contribution in https\://github.com/MetrolistGroup/Metrolist/pull/3948\\r\\n* @Scott-Nx made their first contribution in https\://github.com/MetrolistGroup/Metrolist/pull/3886\\r\\n* @il-Luca made their first contribution in https\://github.com/MetrolistGroup/Metrolist/pull/3890\\r\\n\\r\\n**Full Changelog**\: https\://github.com/MetrolistGroup/Metrolist/compare/v13.5.0...v13.6.0","published_at"\:"2026-06-21T14\:52\:25Z","assets"\:[{"name"\:"Metrolist-izzy.apk","state"\:"uploaded","size"\:25190946,"digest"\:"sha256\:5a952ae5d883f03d885c56cdd898089cf2f049d5337afc42ff044e65af347e14","browser_download_url"\:"https\://github.com/MetrolistGroup/Metrolist/releases/download/v13.6.0/Metrolist-izzy.apk"},{"name"\:"Metroli