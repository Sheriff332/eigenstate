m/MetrolistGroup/Metrolist/releases/download/v12.8.1/Metrolist.apk"}],"target_commitish"\:"main"},{"tag_name"\:"v12.8.0-stable","draft"\:false,"prerelease"\:false,"body"\:"\#\# Changelog v12.8.0\\r\\n\\r\\n\#\#\# New Features\\r\\n\\r\\n- **Wrapped Feature** - Annual listening statistics and year-in-review\\r\\n- **Google Cast Support** - Cast audio to other devices\\r\\n- **Home Screen Widget** - Quick access widget for home screen\\r\\n- **Word-by-Word Lyrics & Karaoke** - Synced lyrics with BetterLyrics provider\\r\\n- **Glowing Lyrics Effect** - Animated glow effect with bounce motion\\r\\n- **Chinese Lyrics Romanization** - Romanization for Simplified and Traditional Chinese\\r\\n- **YouTube Music Search Deeplinks** - Deep link support for YouTube Music searches\\r\\n- **Shuffle Playlist First** - Option to shuffle playlist before playing\\r\\n- **Innertune-style Selection Mode** - Enhanced selection UI with checkboxes\\r\\n- **Draggable Queue Top Bar** - Swipeable top bar in queue screen\\r\\n- **Discord RPC Improvements** - Enhanced Discord Rich Presence integration\\r\\n- **Hide Video Songs Option** - Filter and hide video-only content\\r\\n- **FOSS/GMS Build Flavors** - Separate builds for Google Cast (F-Droid compatible)\\r\\n- **Network Retry Mechanism** - Periodic retry with improved error detection\\r\\n\\r\\n\#\#\# UI Improvements\\r\\n\\r\\n- Comprehensive redesign of playlist and album screens\\r\\n- SearchScreen converted from overlay to full screen\\r\\n- Enhanced player button colors and design\\r\\n- Updated color scheme and appearance settings\\r\\n- Smoother animations with optimized damping ratios\\r\\n- Dynamic bottom padding based on MiniPlayer state\\r\\n- Reduced spacing between album header and song list\\r\\n\\r\\n\#\#\# Bug Fixes\\r\\n\\r\\n- Fixed live performances and \\"from your library\\" sections in artist page\\r\\n- Fixed auto-play functionality for playlists in watch links\\r\\n- Fixed database migration to safely preserve user data\\r\\n- Fixed audio normalization (perceptualLoudnessDb)\\r\\n- Fixed handling of music.youtube.com/watch links with playlist parameter only\\r\\n- Fixed sync button visibility for YouTube playlists\\r\\n- Fixed play button dimensions in legacy design\\r\\n- Fixed Last.fm integration with ArchiveTune improvements\\r\\n- Fixed selection functionality in online playlists\\r\\n- Fixed search history persistence\\r\\n- Fixed source error retry logic\\r\\n\\r\\n\#\#\# Performance\\r\\n\\r\\n- Network improvements and NavRail performance optimization\\r\\n- Enhanced database stability and performance\\r\\n- Improved MusicService radio queue handling and foreground service setup\\r\\n- Updated YouTube client versions\\r\\n\\r\\n\#\# New Contributors\\r\\n\\r\\n* @adrielGGmotion special thanks to my bro for his wonderful work and help\!\\r\\n\\r\\n* @Ughur made their first contribution in https\://github.com/mostafaalagamy/Metrolist/pull/1920\\r\\n* @RealNath made their first contribution in https\://github.com/mostafaalagamy/Metrolist/pull/1911\\r\\n* @liraz747 made their first contribution in https\://github.com/mostafaalagamy/Metrolist/pull/1976\\r\\n* @saivijaychandan made their first contribution in https\://github.com/mostafaalagamy/Metrolist/pull/1987\\r\\n* @malania02 made their first contribution in https\://github.com/mostafaalagamy/Metrolist/pull/2005\\r\\n* @Windowstechtips made their first contribution in https\://github.com/mostafaalagamy/Metrolist/pull/1860\\r\\n* @FrancescoGrazioso made their first contribution in https\://github.com/mostafaalagamy/Metrolist/pull/2020\\r\\n* @crimera made their first contribution in https\://github.com/mostafaalagamy/Metrolist/pull/2052\\r\\n\\r\\n**Full Changelog**\: https\://github.com/mostafaalagamy/Metrolist/compare/v12.7.1...v12.8.0-stable","published_at"\:"2025-12-29T16\:48\:34Z","assets"\:[{"name"\:"app-arm64-release.apk","state"\:"uploaded","size"\:21470456,"digest"\:"sha256\:f4a2245e99298c3042b2b776d9e9ea01ec59