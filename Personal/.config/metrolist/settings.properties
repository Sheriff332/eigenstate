tokens updated\\r\\n- **SimpMusic Lyrics Provider** - Integration with SimpMusic lyrics provider for better lyrics support\\r\\n- **Music & Turntable Widgets Redesign** - Fresh new design for music and turntable widgets\\r\\n- **System Equalizer Integration** - Added system equalizer button to the equalizer dialog for quick access\\r\\n- **Landscape Miniplayer Centering** - Miniplayer now centers properly in landscape mode (by @jimmy-sh)\\r\\n- **Per-Song Lyrics Timing Offset** - Fine-tune lyrics timing for individual songs (by @Cocoa2219)\\r\\n- **Separated Queue and Player Menus** - QueueMenu and PlayerMenu are now separate for better organization\\r\\n- **YouTube Generated Playlists in Android Auto** - Generated playlists from YouTube now appear in Android Auto (by @nyxiereal)\\r\\n- **Faster Silence Skipping** - Improved silence detection and skipping functionality (by @nyxiereal)\\r\\n- **Enhanced Explicit Content Indicators** - Explicit content labels now display in more contexts throughout the app (by @jimmy-sh)\\r\\n\\r\\n\#\# Bug Fixes\\r\\n\\r\\n- **Discord Login Fixed** - Resolved Discord login issues using Kizzy's proven authentication method\\r\\n- **Cast Queue Shuffle Fix** - Fixed shuffle functionality when casting to external devices\\r\\n- **InnerTube API Update** - Updated API compatibility to support the latest YouTube Music response formats\\r\\n\\r\\n\#\# Improvements\\r\\n\\r\\n- **Auto-Resume on Unmute** - Playback automatically resumes when unmuting (by @TheRebo)\\r\\n\\r\\n\#\# New Contributors\\r\\n* @TheRebo made their first contribution in https\://github.com/mostafaalagamy/Metrolist/pull/2293\\r\\n* @Cocoa2219 made their first contribution in https\://github.com/mostafaalagamy/Metrolist/pull/2323\\r\\n* @mahmoud200m made their first contribution in https\://github.com/mostafaalagamy/Metrolist/pull/2343\\r\\n* @nyxiereal made their first contribution in https\://github.com/mostafaalagamy/Metrolist/pull/2333\\r\\n\\r\\n**Full Changelog**\: